meta:
  version: 3
  flow: Chip
  substituting_steps:

    #Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
- dir::../src/directory_controller/directory_controller.sv
- dir::../src/arb/wrr_arbiter.sv
- dir::../src/housekeeping/boot_fsm.sv
- dir::../src/housekeeping/housekeeping_top.sv
- dir::../src/housekeeping/spi_engine.sv
- dir::../src/mem_ctrl/mem2048x32.sv
- dir::../src/mem_ctrl/mem512x32.sv
- dir::../src/mem_ctrl/directory_mem.sv
- dir::../src/mem_ctrl/mem64x8.sv
- dir::../src/interposer_interface/directory_interface.sv
- dir::../src/interposer_interface/lossy_pipe_stage.sv
- dir::../src/interposer_interface/rserializer.sv
- dir::../src/interposer_interface/tserializer.sv

# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

# Tuned design repair for slew/cap cleanup without exploding post-GPL buffering.
SYNTH_STRATEGY: "DELAY 4"
MAX_FANOUT_CONSTRAINT: 12

DESIGN_REPAIR_MAX_WIRE_LENGTH: 0
DESIGN_REPAIR_MAX_SLEW_PCT: 35
DESIGN_REPAIR_MAX_CAP_PCT: 50
DESIGN_REPAIR_REMOVE_BUFFERS: False

GRT_DESIGN_REPAIR_RUN_GRT: True
GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH: 200
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 20
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 30

CTS_CLK_MAX_WIRE_LENGTH: 400
CTS_SINK_CLUSTERING_MAX_DIAMETER: 25
CTS_MAX_CAP: 0.15
CTS_SINK_CLUSTERING_SIZE: 12
CTS_SINK_BUFFER_MAX_CAP_DERATE_PCT: 25

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 50 # 20 MHz

# Fix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Increase for more logic
# on your die
PL_TARGET_DENSITY_PCT: 40
GRT_ALLOW_CONGESTION: true

# Fix antenna violations after DRT
GRT_ANTENNA_REPAIR_ITERS: 10
GRT_ANTENNA_REPAIR_MARGIN: 25 # %
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

# Improve GP stability for this macro-heavy design
#PL_TIME_DRIVEN: False
#PL_ROUTABILITY_DRIVEN: False

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Preserve extracted port identity for LVS pin matching.
MAGIC_EXT_UNIQUE: notopports

MACROS:
  gf180mcu_ws_ip__id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__id/gds/gf180mcu_ws_ip__id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__id/lef/gf180mcu_ws_ip__id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__id/vh/gf180mcu_ws_ip__id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__id/lib/gf180mcu_ws_ip__id.lib
    instances:
      chip_id:
        location: [26, 26]
        orientation: N


  gf180mcu_ws_ip__logo:
    gds:
      - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
    instances:
      wafer_space_logo:
        location: ["expr::$DIE_AREA[2] + -169.25", "expr::$DIE_AREA[3] + -169.25"]
        orientation: N

  gf180mcu_fd_ip_sram__sram512x8m8wm1:
    gds:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/gds/gf180mcu_fd_ip_sram__sram512x8m8wm1.gds
    lef:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lef/gf180mcu_fd_ip_sram__sram512x8m8wm1.lef
    vh:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/verilog/gf180mcu_fd_ip_sram__sram512x8m8wm1__blackbox.v
    lib:
      "*_tt_025C_5v00":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__tt_025C_5v00.lib
      "*_ff_n40C_5v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ff_n40C_5v50.lib
      "*_ss_125C_4v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ss_125C_4v50.lib
    instances:
      # SRAMs instantiated inside directory_mem's mem_ctrl_2048x32
      # Keep them in a centered 4x4 grid with routing channels between macros.
      # Apply a uniform +5um X nudge to avoid marginal M3.2b markers at SRAM M3 edges.
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock0.sram0:
        location: [625, 720]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock0.sram1:
        location: [1380, 720]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock0.sram2:
        location: [2135, 720]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock0.sram3:
        location: [2890, 720]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock1.sram0:
        location: [625, 1805]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock1.sram1:
        location: [1380, 1805]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock1.sram2:
        location: [2135, 1805]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock1.sram3:
        location: [2890, 1805]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock2.sram0:
        location: [625, 2890]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock2.sram1:
        location: [1380, 2890]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock2.sram2:
        location: [2135, 2890]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock2.sram3:
        location: [2890, 2890]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock3.sram0:
        location: [625, 3975]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock3.sram1:
        location: [1380, 3975]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock3.sram2:
        location: [2135, 3975]
        orientation: N
      i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock3.sram3:
        location: [2890, 3975]
        orientation: N

  gf180mcu_fd_ip_sram__sram64x8m8wm1:
    gds:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/gds/gf180mcu_fd_ip_sram__sram64x8m8wm1.gds
    lef:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lef/gf180mcu_fd_ip_sram__sram64x8m8wm1.lef
    vh:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/verilog/gf180mcu_fd_ip_sram__sram64x8m8wm1__blackbox.v
    lib:
      "*_tt_025C_5v00":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram64x8m8wm1__tt_025C_5v00.lib
      "*_ff_n40C_5v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram64x8m8wm1__ff_n40C_5v50.lib
      "*_ss_125C_4v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram64x8m8wm1__ss_125C_4v50.lib
    instances:
      # Directory metadata 64x8 SRAMs. Keep them in the routing channel
      # between the first and second 512x8 SRAM rows.
      i_chip_core.i_directory_mem.i_mem64x8.sram0:
        location: [625, 1385]
        orientation: N
      i_chip_core.i_directory_mem.i_mem64x8.sram1:
        location: [1755, 1385]
        orientation: N
      i_chip_core.i_directory_mem.i_mem64x8.sram2:
        location: [2890, 1385]
        orientation: N

# Power connections for SRAMs
# Format: <instance-regex> <vdd-net> <gnd-net> <macro-vdd-pin> <macro-gnd-pin>
PDN_MACRO_CONNECTIONS:
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock0.sram0 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock0.sram1 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock0.sram2 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock0.sram3 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock1.sram0 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock1.sram1 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock1.sram2 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock1.sram3 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock2.sram0 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock2.sram1 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock2.sram2 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock2.sram3 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock3.sram0 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock3.sram1 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock3.sram2 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem_ctrl_2048x32.memblock3.sram3 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem64x8.sram0 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem64x8.sram1 VDD VSS VDD VSS"
- "i_chip_core.i_directory_mem.i_mem64x8.sram2 VDD VSS VDD VSS"

# Halo size around macros while cutting rows.
# Workaround for: https://github.com/The-OpenROAD-Project/OpenROAD/issues/8868
FP_MACRO_HORIZONTAL_HALO: 5
FP_MACRO_VERTICAL_HALO: 5
PDN_HORIZONTAL_HALO: 3
PDN_VERTICAL_HALO: 3

PDN_CFG: dir::pdn_cfg.tcl

# Custom padring placement: keep LibreLane's default spacing on most sides,
# but place 20-pad east/west rows as two groups of ten pads.
PAD_CFG: dir::pad_cfg.tcl
