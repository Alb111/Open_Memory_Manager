- "i_chip_core.i_main_memory.memblock1.sram2 VDD VSS VDD VSS"
- "i_chip_core.i_main_memory.memblock1.sram3 VDD VSS VDD VSS"
- "i_chip_core.i_main_memory.memblock2.sram0 VDD VSS VDD VSS"
- "i_chip_core.i_main_memory.memblock2.sram1 VDD VSS VDD VSS"
- "i_chip_core.i_main_memory.memblock2.sram2 VDD VSS VDD VSS"
