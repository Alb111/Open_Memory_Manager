  # 5V SRAM
  gf180mcu_fd_ip_sram__sram512x8m8wm1:
    gds:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/gds/gf180mcu_fd_ip_sram__sram512x8m8wm1.gds
    lef:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lef/gf180mcu_fd_ip_sram__sram512x8m8wm1.lef
    vh:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/verilog/gf180mcu_fd_ip_sram__sram512x8m8wm1__blackbox_pp.v
    lib:
      "*_tt_025C_5v00":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__tt_025C_5v00.lib
      "*_ff_n40C_5v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ff_n40C_5v50.lib
      "*_ss_125C_4v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ss_125C_4v50.lib
    instances:
      # SRAMs instantiated inside i_main_memory (mem_ctrl_2048x32).
      # Each memblock is one 512x32 controller (4x sram512x8), grouped into a
      # tight 2x2 quadrant; the four blocks tile a 2x2 super-grid (4x4 macros).
      #
      # All 38 signal pins of this SRAM are on ONE edge (bottom, in N). We
      # MIRROR the two rows of each quadrant so their pin edges face a shared
      # central channel: lower row = FS (pins flipped to top), upper row = N
      # (pins on bottom). Both rows escape into the same channel, which lets the
      # pin-free outer/side edges pack tight.
      #   Within a block: sram0=lower-left, sram1=lower-right,
      #                   sram2=upper-left, sram3=upper-right.
      #   Columns X = {625, 1085 | 1765, 2225}, rows Y = {720, 1355 | 2090, 2725}.
      #   Intra-quadrant: 28um horizontal (pin-free edge, > 2x 10um PDN halo),
      #                   150um vertical (central pin/route/PDN channel).
      #   Inter-quadrant: ~248um horizontal, ~250um vertical.
      # Macro bbox lower-left = location for every orientation (OpenDB origin is
      # normalized), so FS does not shift the footprint. Power pins form a
      # full ring; FS preserves the W/E rails the M4 straps connect to, so the
      # macro PDN grid in pdn_5v_sram.tcl is unaffected. Footprint stays inside
      # the previously-validated region (all coords on the 5um grid).
      #
      # memblock0 -> bottom-left quadrant
      i_chip_core.i_main_memory.memblock0.sram0:
        location: [625, 720]
        orientation: FS
      i_chip_core.i_main_memory.memblock0.sram1:
        location: [1085, 720]
        orientation: FS
      i_chip_core.i_main_memory.memblock0.sram2:
        location: [625, 1355]
        orientation: N
      i_chip_core.i_main_memory.memblock0.sram3:
        location: [1085, 1355]
        orientation: N
      # memblock1 -> bottom-right quadrant
      i_chip_core.i_main_memory.memblock1.sram0:
        location: [1765, 720]
        orientation: FS
      i_chip_core.i_main_memory.memblock1.sram1:
        location: [2225, 720]
        orientation: FS
      i_chip_core.i_main_memory.memblock1.sram2:
        location: [1765, 1355]
        orientation: N
      i_chip_core.i_main_memory.memblock1.sram3:
        location: [2225, 1355]
        orientation: N
      # memblock2 -> top-left quadrant
      i_chip_core.i_main_memory.memblock2.sram0:
        location: [625, 2090]
        orientation: FS
      i_chip_core.i_main_memory.memblock2.sram1:
        location: [1085, 2090]
        orientation: FS
      i_chip_core.i_main_memory.memblock2.sram2:
        location: [625, 2725]
        orientation: N
      i_chip_core.i_main_memory.memblock2.sram3:
        location: [1085, 2725]
        orientation: N
      # memblock3 -> top-right quadrant
      i_chip_core.i_main_memory.memblock3.sram0:
        location: [1765, 2090]
        orientation: FS
      i_chip_core.i_main_memory.memblock3.sram1:
        location: [2225, 2090]
        orientation: FS
      i_chip_core.i_main_memory.memblock3.sram2:
        location: [1765, 2725]
        orientation: N
      i_chip_core.i_main_memory.memblock3.sram3:
        location: [2225, 2725]
        orientation: N

  gf180mcu_fd_ip_sram__sram256x8m8wm1:
    gds:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/gds/gf180mcu_fd_ip_sram__sram256x8m8wm1.gds
    lef:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lef/gf180mcu_fd_ip_sram__sram256x8m8wm1.lef
    vh:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/verilog/gf180mcu_fd_ip_sram__sram256x8m8wm1__blackbox_pp.v
    lib:
      "*_tt_025C_5v00":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram256x8m8wm1__tt_025C_5v00.lib
      "*_ff_n40C_5v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram256x8m8wm1__ff_n40C_5v50.lib
      "*_ss_125C_4v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram256x8m8wm1__ss_125C_4v50.lib
    instances:
      # Directory metadata: three 256x8 bit-plane SRAMs inside mem2048x3.
      # Kept in the routing channel between the first and second 512x8 SRAM
      # rows (row0 top = 1204.88, row1 bottom = 1805). The 256x8 macro is
      # 340.88 tall, so it is centered in the 600.12um channel at y=1335,
      # leaving ~130um clearance above and ~129um below. X matches the old
      # 64x8 columns (same 431.86 width).
      i_chip_core.i_dir_metadata.plane0:
        location: [625, 1335]
        orientation: N
      i_chip_core.i_dir_metadata.plane1:
        location: [1755, 1335]
        orientation: N
      i_chip_core.i_dir_metadata.plane2:
        location: [2890, 1335]
        orientation: N

